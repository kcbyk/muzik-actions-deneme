name: Ses dosyası hazırla

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'İstek kimliği (UUID)'
        required: true
        type: string
      test_mode:
        description: 'Örnek test tonu üret (YouTube indirmez)'
        required: true
        type: boolean
        default: false
      query:
        description: 'Arama terimi veya YouTube bağlantısı (yalnızca izinli içerik)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Yalnız bağımlılıklar önbelleklenir; token, çerez veya ses dosyası girmez.
      - name: Python ortamını önbellekten geri yükle
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: yt-dlp-venv-ubuntu24-python312-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}
      - name: Python bağımlılığını hazırla
        run: |
          if [ "${{ steps.deps-cache.outputs.cache-hit }}" != 'true' ] || ! .venv/bin/python -m yt_dlp --version; then
            python -m venv .venv
            .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          fi
      - name: FFmpeg kontrolü
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: İndir ve dönüştür
        env:
          SEARCH_QUERY: ${{ inputs.query }}
          REQUEST_ID: ${{ inputs.request_id }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: .venv/bin/python main.py
      - name: Release oluştur ve sesi yükle
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          # Python bu değeri önceden UUID biçiminde doğrular.
          gh release create "request-${REQUEST_ID}" output/track.mp3 \
            --title "Ses isteği ${REQUEST_ID}" \
            --notes "Otomatik oluşturulmuş deneme dosyası."
